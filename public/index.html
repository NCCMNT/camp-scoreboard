<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funtime Leaderboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        @font-face {
            font-family: 'Constantine';
            src: url('fonts/Constantine.ttf') format('truetype'),
                 url('Constantine.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        .team-title,
        .emblem-fallback {
            font-family: 'Constantine', system-ui, sans-serif !important;
        }

        :root {
            --bg-image-url: url('bg.jpg');
            --bg-image-opacity: 0.12;
        }

        body {
            margin: 0;
            position: relative;
            min-height: 100vh;
            background-color: var(--bg-main);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: var(--bg-image-url);
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            opacity: var(--bg-image-opacity);
            z-index: 0;
            pointer-events: none;
            filter: saturate(0.95) contrast(0.98);
        }

        /* Rank color variables (will be set from background image palette) */
        :root {
            --rank1-color: #e0a6c7; /* fallback pink */
            --rank2-color: #79c9b4; /* fallback sea green */
            --rank-others-color: #c57a2b; /* fallback brown/orange */
        }

        .block-container {
            max-width: 1100px;
        }

        .leaderboard-list {
            display: grid;
            gap: 1.25rem;
            flex: 1;
        }

        .team-tile {
            position: relative;
            overflow: hidden;
            display: grid;
            grid-template-columns: 9rem 1fr auto;
            align-items: center;
            gap: 1.25rem;
            min-height: 9rem;
            padding: 1.75rem 2rem;
            will-change: transform;
        }

        .team-position,
        .team-title,
        .team-points {
            position: relative;
            z-index: 2;
        }

        /* Apply extracted colors
           - Position numbers use the palette colors
           - Points use special styling: first = gradient+border, second = silver, others = white
        */
        .rank-1 .team-position {
            background: linear-gradient(45deg, #ffd27f 10%, var(--rank1-color) 90%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            font-weight: 800;
        }
        .rank-1 .team-title {
            background: linear-gradient(45deg, #ffd27f 10%, var(--rank1-color) 90%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            font-weight: 800;
        }
        .rank-2 .team-position { color: var(--rank2-color); }
        .team-tile:not(.rank-1):not(.rank-2) .team-position { color: var(--rank-others-color); }

        /* First place: gradient points + subtle gradient border */
        .team-tile.rank-1 {
            border-radius: 0.75rem;
            border: 2px solid transparent; /* gradient border via layered backgrounds */
            background-image: linear-gradient(rgba(28,26,23,0.88), rgba(38,34,29,0.88)), linear-gradient(135deg, #ffd27f 0%, var(--rank1-color) 100%);
            background-origin: padding-box, border-box;
            background-clip: padding-box, border-box;
        }
        .rank-1 .team-points {
            background: linear-gradient(45deg, #ffd27f 10%, var(--rank1-color) 90%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 900;
        }
        .rank-1 .team-points span { color: var(--muted); }

        /* Second place: position colored by palette, points in silver/grey */
        .rank-2 .team-points { color: #bdbdbd; }
        .rank-2 .team-points span { color: var(--muted); }

        /* Others: darker/brown positions, numeric score must be white */
        .team-tile:not(.rank-1):not(.rank-2) .team-points { color: #ffffff; }
        .team-tile:not(.rank-1):not(.rank-2) .team-points span { color: var(--muted); }
        .team-tile:not(.rank-1):not(.rank-2) .team-title { color: var(--rank-others-color); }

        .team-position {
            font-size: 3rem;
            font-weight: 800;
            color: var(--accent);
            text-align: left;
            padding-left: 0.5rem;
            white-space: nowrap;
            font-family: 'Constantine', sans-serif;
        }

        .team-emblem {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 45%; /* Poszerzone do 45%, by płynne przejście miało przestrzeń */
            background: linear-gradient(160deg, rgba(38, 34, 29, 0.9), rgba(28, 26, 23, 0.9));
            border: none;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
            opacity: 0.35;

            -webkit-mask-image: linear-gradient(108deg, #000 0%, #000 55%, transparent 92%);
            mask-image: linear-gradient(108deg, #000 0%, #000 55%, transparent 92%);
        }

        .team-emblem img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            inset: 0;
        }

        .team-emblem:has(img) .emblem-fallback {
            display: none;
        }

        .team-emblem .emblem-fallback {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--muted);
            opacity: 0.3;
        }

        .team-title {
            font-size: clamp(1.75rem, 4vw, 2.75rem);
            font-weight: 800;
            text-align: left;
            letter-spacing: -0.02em;
            line-height: 1.1;
            text-transform: uppercase;
        }

        /* Style name input in any login view to match admin PIN/password styling */
        input[type="text"], input[type="password"], input[type="number"] {
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            padding: 0.5rem;
            font-family: var(--font);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
        }

        .team-points {
            justify-self: end;
            font-size: clamp(2rem, 5vw, 3.25rem);
            font-weight: 900;
            color: var(--text);
            text-align: right;
            white-space: nowrap;
        }

        .team-points span {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.3rem;
            white-space: nowrap;
            margin-top: 0.2rem;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.08rem;
            text-transform: uppercase;
            color: var(--muted);
        }

        .trend-arrow {
            display: inline-block;
            font-size: 1.3em;
            line-height: 1;
        }

        .trend-arrow.trend-up {
            color: var(--success);
        }

        .trend-arrow.trend-down {
            color: #c0453a;
        }

        @media (max-width: 640px) {
            .team-tile {
                grid-template-columns: 5.5rem 1fr;
                grid-template-areas:
                    "position points"
                    "title title";
                gap: 0.9rem 0.85rem;
                min-height: 7rem;
                padding: 1.35rem 1.5rem;
            }

            .team-position {
                grid-area: position;
                font-size: 1.8rem;
            }

            .team-title {
                grid-area: title;
                text-align: left;
            }

            .team-points {
                grid-area: points;
            }

            .team-emblem {
                width: 55%;
                -webkit-mask-image: linear-gradient(108deg, #000 0%, #000 45%, transparent 90%);
                mask-image: linear-gradient(108deg, #000 0%, #000 45%, transparent 90%);
            }
        }
    </style>
</head>
<body>
    <div class="block-container">
        <div id="leaderboard-rows" class="leaderboard-list"></div>
    </div>

    <script>
        /* --- Palette extraction from background image --- */
        function parseCssUrl(val) {
            if (!val) return null;
            val = val.trim();
            if (val.startsWith('url(')) val = val.slice(4, -1).trim();
            return val.replace(/^['"]|['"]$/g, '');
        }

        function loadImage(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = url;
            });
        }

        function toHex(rgb) {
            return '#' + [rgb.r, rgb.g, rgb.b].map(v => v.toString(16).padStart(2, '0')).join('');
        }

        function extractPalette(img, bucketShift = 4, maxColors = 8) {
            const w = Math.max(32, Math.round(img.width * 0.12));
            const h = Math.max(32, Math.round(img.height * 0.12));
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            const ctx = c.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const data = ctx.getImageData(0, 0, w, h).data;

            const buckets = new Map();
            for (let i = 0; i < data.length; i += 4 * 2) { // sample every other pixel for speed
                const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
                if (a < 125) continue; // skip transparent
                const kr = r >> bucketShift, kg = g >> bucketShift, kb = b >> bucketShift;
                const key = (kr << 16) | (kg << 8) | kb;
                const entry = buckets.get(key) || {count:0, r:0, g:0, b:0};
                entry.count += 1; entry.r += r; entry.g += g; entry.b += b;
                buckets.set(key, entry);
            }

            const list = Array.from(buckets.entries()).map(([key, v]) => {
                return { key, count: v.count, r: Math.round(v.r / v.count), g: Math.round(v.g / v.count), b: Math.round(v.b / v.count) };
            });
            list.sort((a,b) => b.count - a.count);
            return list.slice(0, maxColors).map(c => ({ r: c.r, g: c.g, b: c.b, hex: toHex(c) }));
        }

        function pickColorByPreference(palette, preference) {
            // preference: 'red', 'green', 'warm'
            if (!palette || palette.length === 0) return null;
            let best = palette[0];
            let bestScore = -Infinity;
            for (const p of palette) {
                const r = p.r, g = p.g, b = p.b;
                const brightness = (r + g + b) / 3;
                let score = 0;
                if (preference === 'red') score = r - (g + b) * 0.5 + (brightness - 128) * 0.2;
                else if (preference === 'green') score = g - (r + b) * 0.5 + (brightness - 110) * 0.12;
                else if (preference === 'warm') score = (r + g) - b - Math.abs(128 - brightness) * 0.05;
                else score = p.count;
                if (score > bestScore) { bestScore = score; best = p; }
            }
            return best.hex;
        }

        async function applyPaletteFromBackground() {
            try {
                const styleVal = getComputedStyle(document.documentElement).getPropertyValue('--bg-image-url');
                const url = parseCssUrl(styleVal) || 'bg.jpg';
                const img = await loadImage(url);
                const palette = extractPalette(img, 4, 8);

                const rank1 = pickColorByPreference(palette, 'red') || '#e0a6c7'; // pink-like
                const rank2 = pickColorByPreference(palette, 'green') || '#79c9b4'; // sea-green-like
                const others = pickColorByPreference(palette, 'warm') || '#c57a2b'; // brown/orange-like

                function hexToRgb(hex) {
                    hex = hex.replace('#','');
                    if (hex.length === 3) hex = hex.split('').map(c=>c+c).join('');
                    const n = parseInt(hex, 16);
                    return { r: (n>>16)&255, g: (n>>8)&255, b: n&255 };
                }
                function rgbToHex(r,g,b) { return '#' + [r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
                function darkenHex(hex, amt) {
                    const c = hexToRgb(hex);
                    const factor = 1 - amt;
                    return rgbToHex(c.r * factor, c.g * factor, c.b * factor);
                }

                const othersDarker = darkenHex(others, 0.25);

                document.documentElement.style.setProperty('--rank1-color', rank1);
                document.documentElement.style.setProperty('--rank2-color', rank2);
                document.documentElement.style.setProperty('--rank-others-color', othersDarker);
            } catch (err) {
                // silently fail and keep fallbacks
                console.warn('Palette extraction failed', err);
            }
        }

        function getTeamName(row) {
            return row.Team ?? row.team_name ?? row.team ?? 'Unknown Team';
        }

        function getPoints(row) {
            const value = row.Points ?? row.points_summed ?? row.points ?? 0;
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : 0;
        }

        function getCleanKey(teamName) {
            return teamName.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
        }

        let dayColumns = [];
        let currentDayIndex = null;

        async function fetchDayConfig() {
            try {
                const res = await fetch('/api/day-columns');
                if (!res.ok) return { days: [], currentDayIndex: null };
                const data = await res.json();
                return {
                    days: Array.isArray(data.days) ? data.days : [],
                    currentDayIndex: data.currentDayIndex ?? null
                };
            } catch (error) {
                return { days: [], currentDayIndex: null };
            }
        }

        function computePastRanks(data) {
            if (!dayColumns.length) return null;

            let compareCol = null;
            if (currentDayIndex && currentDayIndex >= 2) {
                compareCol = dayColumns[currentDayIndex - 2]; // day before today
            } else if (!currentDayIndex && dayColumns.length >= 2) {
                // All days captured - compare final standings to the day before the last one
                compareCol = dayColumns[dayColumns.length - 2];
            }

            if (!compareCol) return null; // day 1, no prior day to compare against yet

            const scoreOf = (row) => {
                const v = Number(row[compareCol]);
                return Number.isFinite(v) ? v : 0; // missing/blank cells count as 0, not disqualifying
            };

            const ranked = [...data].sort((a, b) => scoreOf(b) - scoreOf(a));
            const rankMap = new Map();
            ranked.forEach((row, idx) => rankMap.set(getTeamName(row), idx + 1));
            return rankMap;
        }

        function getTrendArrow(teamName, currentRank, pastRanks) {
            if (!pastRanks || !pastRanks.has(teamName)) return '';
            const pastRank = pastRanks.get(teamName);
            if (currentRank < pastRank) return '<span class="trend-arrow trend-up">&#9650;</span>';
            if (currentRank > pastRank) return '<span class="trend-arrow trend-down">&#9660;</span>';
            return '';
        }

        function buildTileInner(row, rankClass, trendArrow, index, teamName, cleanKey) {
            return `
                <div class="team-position ${rankClass}">${index + 1}</div>
                <div class="team-emblem">
                    <img src="emblems/${cleanKey}.png" alt="" onerror="this.remove()">
                    <span class="emblem-fallback">${teamName.charAt(0).toUpperCase()}</span>
                </div>
                <div class="team-title">${teamName}</div>
                <div class="team-points">${getPoints(row)}<span>${trendArrow}Points</span></div>
            `;
        }

        async function fetchLeaderboard() {
            const [scoresRes, config] = await Promise.all([
                fetch('/api/scores'),
                fetchDayConfig()
            ]);
            dayColumns = config.days;
            currentDayIndex = config.currentDayIndex;

            const data = await scoresRes.json();

            data.sort((a, b) => getPoints(b) - getPoints(a));

            const pastRanks = computePastRanks(data);

            const container = document.getElementById('leaderboard-rows');

            // FLIP step 1 (First): record current on-screen positions before we touch anything
            const firstRects = new Map();
            container.querySelectorAll('.team-tile').forEach(el => {
                firstRects.set(el.dataset.team, el.getBoundingClientRect());
            });

            const seenKeys = new Set();

            data.forEach((row, index) => {
                const teamName = getTeamName(row);
                const cleanKey = getCleanKey(teamName);
                seenKeys.add(cleanKey);
                const trendArrow = getTrendArrow(teamName, index + 1, pastRanks);

                let rankClass = "";
                if (index === 0) rankClass = "rank-1";
                else if (index === 1) rankClass = "rank-2";

                let el = container.querySelector(`.team-tile[data-team="${cleanKey}"]`);
                const isNew = !el;
                if (isNew) {
                    el = document.createElement('div');
                    el.dataset.team = cleanKey;
                    el.setAttribute('data-testid', 'stContainer');
                }
                el.className = `team-tile ${rankClass}`;
                el.innerHTML = buildTileInner(row, rankClass, trendArrow, index, teamName, cleanKey);

                // Reorder: put this element in its correct slot among current siblings
                const referenceNode = container.children[index];
                if (referenceNode !== el) {
                    container.insertBefore(el, referenceNode || null);
                }

                if (isNew) {
                    // Simple fade/slide-in for brand new tiles (no prior position to FLIP from)
                    el.style.transition = 'none';
                    el.style.opacity = '0';
                    el.style.transform = 'translateY(-12px)';
                    void el.offsetHeight; // force reflow
                    el.style.transition = 'opacity 0.7s ease, transform 0.7s ease';
                    el.style.opacity = '';
                    el.style.transform = '';
                }
            });

            // Drop tiles for teams no longer present
            Array.from(container.querySelectorAll('.team-tile')).forEach(el => {
                if (!seenKeys.has(el.dataset.team)) el.remove();
            });

            // FLIP steps 2-4 (Last, Invert, Play): diff old vs new position, animate the delta away
            container.querySelectorAll('.team-tile').forEach(el => {
                const first = firstRects.get(el.dataset.team);
                if (!first) return; // brand new tile, already handled above

                const last = el.getBoundingClientRect();
                const deltaY = first.top - last.top;
                if (Math.abs(deltaY) < 1) return;

                el.style.transition = 'none';
                el.style.transform = `translateY(${deltaY}px)`;
                void el.offsetHeight; // force reflow so the browser commits the "Invert" position
                el.style.transition = 'transform 1.4s cubic-bezier(0.22, 1, 0.36, 1)';
                el.style.transform = '';
            });
        }
        (async function init() {
            await applyPaletteFromBackground();
            await fetchLeaderboard();
            setInterval(fetchLeaderboard, 10000);
        })();
    </script>
</body>
</html>
