<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funtime Leaderboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .block-container {
            max-width: 1100px;
        }

        .leaderboard-list {
            display: grid;
            gap: 1.25rem;
            flex: 1;
        }

        .team-tile {
            display: grid;
            grid-template-columns: minmax(4.5rem, auto) auto 1fr auto;
            align-items: center;
            gap: 1.25rem;
            min-height: 9rem;
            padding: 1.75rem 2rem;
        }

        .team-position {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--accent);
            text-align: left;
            white-space: nowrap;
        }

        .team-emblem {
            width: clamp(5rem, 10vw, 6.5rem);
            aspect-ratio: 1;
            border-radius: 1rem;
            background: linear-gradient(160deg, var(--bg-card), var(--bg-main));
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .team-emblem:has(img) .emblem-fallback {
            display: none;
        }

        .team-emblem img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            inset: 0;
        }

        .team-emblem {
            position: relative;
        }

        .team-emblem .emblem-fallback {
            font-size: clamp(1.1rem, 2.5vw, 1.5rem);
            font-weight: 800;
            color: var(--muted);
        }

        .team-title {
            font-size: clamp(1.75rem, 4vw, 2.75rem);
            font-weight: 800;
            text-align: center;
            letter-spacing: -0.02em;
            line-height: 1.1;
            text-transform: uppercase;
        }

        .team-points {
            justify-self: end;
            font-size: clamp(2rem, 5vw, 3.25rem);
            font-weight: 900;
            color: var(--text);
            text-align: right;
            white-space: nowrap;
        }

        .team-points span {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.3rem;
            white-space: nowrap;
            margin-top: 0.2rem;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.08rem;
            text-transform: uppercase;
            color: var(--muted);
        }

        .trend-arrow {
            display: inline-block;
            font-size: 1.3em;
            line-height: 1;
        }

        .trend-arrow.trend-up {
            color: var(--success);
        }

        .trend-arrow.trend-down {
            color: #c0453a;
        }

        @media (max-width: 640px) {
            .team-tile {
                grid-template-columns: 2.75rem 4.5rem 1fr;
                grid-template-areas:
                    "position emblem points"
                    "title title title";
                gap: 0.9rem 0.85rem;
                min-height: 7rem;
                padding: 1.35rem 1.5rem;
            }

            .team-emblem {
                grid-area: emblem;
                width: 3rem;
            }

            .team-position {
                grid-area: position;
            }

            .team-title {
                grid-area: title;
                text-align: left;
            }

            .team-points {
                grid-area: points;
            }
        }
    </style>
</head>
<body>
    <div class="block-container">
        <div id="leaderboard-rows" class="leaderboard-list"></div>
    </div>

    <script>
        function getTeamName(row) {
            return row.Team ?? row.team_name ?? row.team ?? 'Unknown Team';
        }

        function getPoints(row) {
            const value = row.Points ?? row.points_summed ?? row.points ?? 0;
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : 0;
        }

        // Builds a filename-safe key from a team name, used to look up that
        // team's emblem image at emblems/<key>.png (drop your own art there).
        function getCleanKey(teamName) {
            return teamName.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
        }

        let dayColumns = [];

        async function fetchDayColumns() {
            try {
                const res = await fetch('/api/day-columns');
                if (!res.ok) return [];
                const data = await res.json();
                return Array.isArray(data.days) ? data.days : [];
            } catch (error) {
                return [];
            }
        }

        // Finds the most recent day column that every team has a value for,
        // and returns a Map of teamName -> rank (1 = first place) on that day.
        function computePastRanks(data) {
            let chosenCol = null;
            for (let i = dayColumns.length - 1; i >= 0; i--) {
                const col = dayColumns[i];
                const allFilled = data.every(row => {
                    const raw = row[col];
                    return raw !== undefined && raw !== null && String(raw).trim() !== '' && Number.isFinite(Number(raw));
                });
                if (allFilled) {
                    chosenCol = col;
                    break;
                }
            }
            if (!chosenCol) return null;

            const ranked = [...data].sort((a, b) => Number(b[chosenCol]) - Number(a[chosenCol]));
            const rankMap = new Map();
            ranked.forEach((row, idx) => rankMap.set(getTeamName(row), idx + 1));
            return rankMap;
        }

        // Compares a team's current leaderboard position against their
        // position on the last fully-recorded day. Shows nothing until a
        // full day of snapshots exists.
        function getTrendArrow(teamName, currentRank, pastRanks) {
            if (!pastRanks || !pastRanks.has(teamName)) return '';
            const pastRank = pastRanks.get(teamName);
            if (currentRank < pastRank) return '<span class="trend-arrow trend-up">&#9650;</span>';
            if (currentRank > pastRank) return '<span class="trend-arrow trend-down">&#9660;</span>';
            return '';
        }

        async function fetchLeaderboard() {
            const [scoresRes, days] = await Promise.all([
                fetch('/api/scores'),
                dayColumns.length ? Promise.resolve(dayColumns) : fetchDayColumns()
            ]);
            dayColumns = days;

            const data = await scoresRes.json();

            data.sort((a, b) => getPoints(b) - getPoints(a));

            const pastRanks = computePastRanks(data);

            const container = document.getElementById('leaderboard-rows');
            container.innerHTML = '';
            
            data.forEach((row, index) => {
                const teamName = getTeamName(row);
                const points = getPoints(row);
                const trendArrow = getTrendArrow(teamName, index + 1, pastRanks);
                
                // Assign class based on 0-indexed placement
                let rankClass = "";
                if (index === 0) rankClass = "rank-1";
                else if (index === 1) rankClass = "rank-2";

                container.innerHTML += `
                    <div data-testid="stContainer" class="team-tile ${rankClass}">
                        <div class="team-position ${rankClass}">#${index + 1}</div>
                        <div class="team-emblem">
                            <img src="emblems/${getCleanKey(teamName)}.png" alt="" onerror="this.remove()">
                            <span class="emblem-fallback">${teamName.charAt(0).toUpperCase()}</span>
                        </div>
                        <div class="team-title">${teamName}</div>
                        <div class="team-points">${points}<span>${trendArrow}Points</span></div>
                    </div>
                `;
            });
        }
        fetchLeaderboard();
        // Automatically check for background updates every 10 seconds silently
        setInterval(fetchLeaderboard, 10000);
    </script>
</body>
</html>
