<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camp Arena - Leaderboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .leaderboard-list {
            display: grid;
            gap: 0.9rem;
        }

        .team-tile {
            display: grid;
            grid-template-columns: minmax(3.5rem, auto) 1fr auto;
            align-items: center;
            gap: 1rem;
            min-height: 5rem;
            padding: 1rem 1.1rem;
        }

        .team-position {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent);
            text-align: left;
            white-space: nowrap;
        }

        .team-title {
            font-size: clamp(1.25rem, 2.5vw, 1.75rem);
            font-weight: 800;
            text-align: center;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        .team-points {
            justify-self: end;
            font-size: clamp(1.5rem, 3vw, 2rem);
            font-weight: 900;
            color: var(--text);
            text-align: right;
            white-space: nowrap;
        }

        .team-points span {
            display: block;
            margin-top: 0.15rem;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.08rem;
            text-transform: uppercase;
            color: var(--muted);
        }

        @media (max-width: 640px) {
            .team-tile {
                grid-template-columns: 2.5rem 1fr;
                grid-template-areas:
                    "position points"
                    "title title";
                gap: 0.65rem 0.9rem;
            }

            .team-position {
                grid-area: position;
            }

            .team-title {
                grid-area: title;
                text-align: left;
            }

            .team-points {
                grid-area: points;
            }
        }
    </style>
</head>
<body>
    <div class="block-container">
        <div id="leaderboard-rows" class="leaderboard-list"></div>
    </div>

    <script>
        function getTeamName(row) {
            return row.Team ?? row.team_name ?? row.team ?? 'Unknown Team';
        }

        function getPoints(row) {
            const value = row.Points ?? row.points_summed ?? row.points ?? 0;
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : 0;
        }

        async function fetchLeaderboard() {
            const res = await fetch('/api/scores');
            const data = await res.json();

            data.sort((a, b) => getPoints(b) - getPoints(a));

            const container = document.getElementById('leaderboard-rows');
            container.innerHTML = '';
            
            data.forEach((row, index) => {
                const teamName = getTeamName(row);
                const points = getPoints(row);
                
                // Assign class based on 0-indexed placement
                let rankClass = "";
                if (index === 0) rankClass = "rank-1";
                else if (index === 1) rankClass = "rank-2";

                container.innerHTML += `
                    <div data-testid="stContainer" class="team-tile ${rankClass}">
                        <div class="team-position ${rankClass}">#${index + 1}</div>
                        <div class="team-title">${teamName}</div>
                        <div class="team-points">${points}<span>Points</span></div>
                    </div>
                `;
            });
        }
        fetchLeaderboard();
        // Automatically check for background updates every 10 seconds silently
        setInterval(fetchLeaderboard, 10000);
    </script>
</body>
</html>
