<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funtime Leaderboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        @font-face {
            font-family: 'Constantine';
            src: url('fonts/Constantine.ttf') format('truetype'),
                 url('Constantine.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        .team-title,
        .emblem-fallback {
            font-family: 'Constantine', system-ui, sans-serif !important;
        }

        :root {
            --bg-image-url: url('bg.jpg');
            --bg-image-opacity: 0.12;
        }

        body {
            margin: 0;
            position: relative;
            min-height: 100vh;
            background-color: var(--bg-main);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: var(--bg-image-url);
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            opacity: var(--bg-image-opacity);
            z-index: 0;
            pointer-events: none;
            filter: saturate(0.95) contrast(0.98);
        }

        .block-container {
            max-width: 1100px;
        }

        .leaderboard-list {
            display: grid;
            gap: 1.25rem;
            flex: 1;
        }

        .team-tile {
            position: relative;
            overflow: hidden;
            display: grid;
            grid-template-columns: 9rem 1fr auto;
            align-items: center;
            gap: 1.25rem;
            min-height: 9rem;
            padding: 1.75rem 2rem;
        }

        .team-position,
        .team-title,
        .team-points {
            position: relative;
            z-index: 2;
        }

        .team-position {
            font-size: 3rem;
            font-weight: 800;
            color: var(--accent);
            text-align: left;
            padding-left: 0.5rem;
            white-space: nowrap;
            font-family: 'Constantine', sans-serif;
        }

        .team-emblem {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 40%;
            background: linear-gradient(160deg, rgba(38, 34, 29, 0.9), rgba(28, 26, 23, 0.9));
            border: none;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
            opacity: 0.25;
            clip-path: polygon(0 0, 80% 0, 100% 100%, 0 100%);
        }

        .team-emblem img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            inset: 0;
        }

        .team-emblem:has(img) .emblem-fallback {
            display: none;
        }

        .team-emblem .emblem-fallback {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--muted);
            opacity: 0.3;
        }

        .team-title {
            font-size: clamp(1.75rem, 4vw, 2.75rem);
            font-weight: 800;
            text-align: left;
            letter-spacing: -0.02em;
            line-height: 1.1;
            text-transform: uppercase;
        }

        .team-points {
            justify-self: end;
            font-size: clamp(2rem, 5vw, 3.25rem);
            font-weight: 900;
            color: var(--text);
            text-align: right;
            white-space: nowrap;
        }

        .team-points span {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.3rem;
            white-space: nowrap;
            margin-top: 0.2rem;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.08rem;
            text-transform: uppercase;
            color: var(--muted);
        }

        .trend-arrow {
            display: inline-block;
            font-size: 1.3em;
            line-height: 1;
        }

        .trend-arrow.trend-up {
            color: var(--success);
        }

        .trend-arrow.trend-down {
            color: #c0453a;
        }

        @media (max-width: 640px) {
            .team-tile {
                grid-template-columns: 5.5rem 1fr;
                grid-template-areas:
                    "position points"
                    "title title";
                gap: 0.9rem 0.85rem;
                min-height: 7rem;
                padding: 1.35rem 1.5rem;
            }

            .team-position {
                grid-area: position;
                font-size: 1.8rem;
            }

            .team-title {
                grid-area: title;
                text-align: left;
            }

            .team-points {
                grid-area: points;
            }

            .team-emblem {
                width: 50%;
                clip-path: polygon(0 0, 75% 0, 95% 100%, 0 100%);
            }
        }
    </style>
</head>
<body>
    <div class="block-container">
        <div id="leaderboard-rows" class="leaderboard-list"></div>
    </div>

    <script>
        function getTeamName(row) {
            return row.Team ?? row.team_name ?? row.team ?? 'Unknown Team';
        }

        function getPoints(row) {
            const value = row.Points ?? row.points_summed ?? row.points ?? 0;
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : 0;
        }

        function getCleanKey(teamName) {
            return teamName.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
        }

        let dayColumns = [];

        async function fetchDayColumns() {
            try {
                const res = await fetch('/api/day-columns');
                if (!res.ok) return [];
                const data = await res.json();
                return Array.isArray(data.days) ? data.days : [];
            } catch (error) {
                return [];
            }
        }

        function computePastRanks(data) {
            let chosenCol = null;
            for (let i = dayColumns.length - 1; i >= 0; i--) {
                const col = dayColumns[i];
                const allFilled = data.every(row => {
                    const raw = row[col];
                    return raw !== undefined && raw !== null && String(raw).trim() !== '' && Number.isFinite(Number(raw));
                });
                if (allFilled) {
                    chosenCol = col;
                    break;
                }
            }
            if (!chosenCol) return null;

            const ranked = [...data].sort((a, b) => Number(b[chosenCol]) - Number(a[chosenCol]));
            const rankMap = new Map();
            ranked.forEach((row, idx) => rankMap.set(getTeamName(row), idx + 1));
            return rankMap;
        }

        function getTrendArrow(teamName, currentRank, pastRanks) {
            if (!pastRanks || !pastRanks.has(teamName)) return '';
            const pastRank = pastRanks.get(teamName);
            if (currentRank < pastRank) return '<span class="trend-arrow trend-up">&#9650;</span>';
            if (currentRank > pastRank) return '<span class="trend-arrow trend-down">&#9660;</span>';
            return '';
        }

        async function fetchLeaderboard() {
            const [scoresRes, days] = await Promise.all([
                fetch('/api/scores'),
                dayColumns.length ? Promise.resolve(dayColumns) : fetchDayColumns()
            ]);
            dayColumns = days;

            const data = await scoresRes.json();

            data.sort((a, b) => getPoints(b) - getPoints(a));

            const pastRanks = computePastRanks(data);

            const container = document.getElementById('leaderboard-rows');
            container.innerHTML = '';
            
            data.forEach((row, index) => {
                const teamName = getTeamName(row);
                const points = getPoints(row);
                const trendArrow = getTrendArrow(teamName, index + 1, pastRanks);
                
                let rankClass = "";
                if (index === 0) rankClass = "rank-1";
                else if (index === 1) rankClass = "rank-2";

                container.innerHTML += `
                    <div data-testid="stContainer" class="team-tile ${rankClass}">
                        <div class="team-position ${rankClass}">${index + 1}</div>
                        <div class="team-emblem">
                            <img src="emblems/${getCleanKey(teamName)}.png" alt="" onerror="this.remove()">
                            <span class="emblem-fallback">${teamName.charAt(0).toUpperCase()}</span>
                        </div>
                        <div class="team-title">${teamName}</div>
                        <div class="team-points">${points}<span>${trendArrow}Points</span></div>
                    </div>
                `;
            });
        }
        fetchLeaderboard();
        setInterval(fetchLeaderboard, 10000);
    </script>
</body>
</html>
