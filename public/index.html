<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camp Arena - Leaderboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .block-container {
            max-width: 1100px;
        }

        .leaderboard-list {
            display: grid;
            gap: 1.25rem;
            flex: 1;
        }

        .team-tile {
            display: grid;
            grid-template-columns: minmax(4.5rem, auto) 1fr auto;
            align-items: center;
            gap: 1.5rem;
            min-height: 9rem;
            padding: 1.75rem 2rem;
        }

        .team-position {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--accent);
            text-align: left;
            white-space: nowrap;
        }

        .team-title {
            font-size: clamp(1.75rem, 4vw, 2.75rem);
            font-weight: 800;
            text-align: center;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        .team-points {
            justify-self: end;
            font-size: clamp(2rem, 5vw, 3.25rem);
            font-weight: 900;
            color: var(--text);
            text-align: right;
            white-space: nowrap;
        }

        .team-points span {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.3rem;
            white-space: nowrap;
            margin-top: 0.2rem;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.08rem;
            text-transform: uppercase;
            color: var(--muted);
        }

        .trend-arrow {
            display: inline-block;
            font-size: 1.3em;
            line-height: 1;
        }

        .trend-arrow.trend-up {
            color: var(--success);
        }

        .trend-arrow.trend-down {
            color: #c0453a;
        }

        @media (max-width: 640px) {
            .team-tile {
                grid-template-columns: 3rem 1fr;
                grid-template-areas:
                    "position points"
                    "title title";
                gap: 0.9rem 1.1rem;
                min-height: 7rem;
                padding: 1.35rem 1.5rem;
            }

            .team-position {
                grid-area: position;
            }

            .team-title {
                grid-area: title;
                text-align: left;
            }

            .team-points {
                grid-area: points;
            }
        }
    </style>
</head>
<body>
    <div class="block-container">
        <div id="leaderboard-rows" class="leaderboard-list"></div>
    </div>

    <script>
        function getTeamName(row) {
            return row.Team ?? row.team_name ?? row.team ?? 'Unknown Team';
        }

        function getPoints(row) {
            const value = row.Points ?? row.points_summed ?? row.points ?? 0;
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : 0;
        }

        let dayColumns = [];
        let summaryColumn = null;

        async function fetchDayConfig() {
            try {
                const res = await fetch('/api/day-columns');
                if (!res.ok) return { days: [], summaryColumn: null };
                const data = await res.json();
                return {
                    days: Array.isArray(data.days) ? data.days : [],
                    summaryColumn: data.summaryColumn ?? null
                };
            } catch (error) {
                return { days: [], summaryColumn: null };
            }
        }

        // Compares the current live points_summary value against the most
        // recently recorded day column. Shows nothing until at least one
        // day has been captured.
        function getTrendArrow(row) {
            let lastRecorded = null;
            for (let i = dayColumns.length - 1; i >= 0; i--) {
                const raw = row[dayColumns[i]];
                if (raw === undefined || raw === null || String(raw).trim() === '') continue;
                const parsed = Number(raw);
                if (Number.isFinite(parsed)) {
                    lastRecorded = parsed;
                    break;
                }
            }

            if (lastRecorded === null) return '';

            const currentRaw = summaryColumn ? row[summaryColumn] : undefined;
            const current = Number.isFinite(Number(currentRaw)) ? Number(currentRaw) : getPoints(row);

            if (current > lastRecorded) return '<span class="trend-arrow trend-up">&#9650;</span>';
            if (current < lastRecorded) return '<span class="trend-arrow trend-down">&#9660;</span>';
            return '';
        }

        async function fetchLeaderboard() {
            const [scoresRes, config] = await Promise.all([
                fetch('/api/scores'),
                dayColumns.length ? Promise.resolve({ days: dayColumns, summaryColumn }) : fetchDayConfig()
            ]);
            dayColumns = config.days;
            summaryColumn = config.summaryColumn;

            const data = await scoresRes.json();

            data.sort((a, b) => getPoints(b) - getPoints(a));

            const container = document.getElementById('leaderboard-rows');
            container.innerHTML = '';
            
            data.forEach((row, index) => {
                const teamName = getTeamName(row);
                const points = getPoints(row);
                const trendArrow = getTrendArrow(row);
                
                // Assign class based on 0-indexed placement
                let rankClass = "";
                if (index === 0) rankClass = "rank-1";
                else if (index === 1) rankClass = "rank-2";

                container.innerHTML += `
                    <div data-testid="stContainer" class="team-tile ${rankClass}">
                        <div class="team-position ${rankClass}">#${index + 1}</div>
                        <div class="team-title">${teamName}</div>
                        <div class="team-points">${points}<span>${trendArrow}Points</span></div>
                    </div>
                `;
            });
        }
        fetchLeaderboard();
        // Automatically check for background updates every 10 seconds silently
        setInterval(fetchLeaderboard, 10000);
    </script>
</body>
</html>
