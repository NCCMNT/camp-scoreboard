<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funtime Control Panel</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .controls-list {
            display: grid;
            gap: 0.9rem;
        }

        .team-title {
            font-size: clamp(1.15rem, 2.5vw, 1.65rem);
            font-weight: 800;
            text-align: center;
            letter-spacing: -0.02em;
            line-height: 1.1;
            text-transform: uppercase;
        }

        /* Mobile-first: this is the default (phone) layout. Wider screens
           get a more spacious side-by-side arrangement below. */
        .control-tile {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding: 1.1rem 1.25rem;
        }

        /* control-meta is the grid; points-row dissolves via display:contents
           so overall-points/current-points become direct grid items
           alongside change-control and the status line. */
        .control-meta {
            display: grid;
            grid-template-columns: 1fr auto;
            grid-template-areas:
                ".       current"
                "overall controls"
                "status  status";
            align-items: center;
            gap: 0.5rem 0.75rem;
        }

        .points-row {
            display: contents;
        }

        /* Current points: top-right, directly above the buttons */
        .current-points {
            grid-area: current;
            justify-self: end;
            font-size: clamp(1.35rem, 3vw, 1.9rem);
            font-weight: 900;
            color: var(--text);
            text-align: right;
            white-space: nowrap;
        }

        .current-points span {
            display: block;
            margin-top: 0.15rem;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.08rem;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* Overall points: bottom-left corner, sharing a row with the buttons */
        .overall-points {
            grid-area: overall;
            justify-self: start;
            font-size: clamp(1rem, 2.2vw, 1.3rem);
            font-weight: 700;
            color: var(--muted);
            text-align: left;
            white-space: nowrap;
        }

        .overall-points span {
            display: block;
            margin-top: 0.15rem;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.08rem;
            text-transform: uppercase;
            color: var(--muted);
            opacity: 0.75;
        }

        .change-control {
            grid-area: controls;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .change-value {
            width: 4.5rem;
            height: 3rem;
            text-align: center;
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            padding: 0.5rem;
            font-family: var(--font);
            font-size: 1.05rem;
            font-weight: 700;
        }

        .change-value::-webkit-outer-spin-button,
        .change-value::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .change-value {
            appearance: textfield;
            -moz-appearance: textfield;
        }

        .change-button {
            width: 3rem;
            height: 3rem;
            font-size: 1.2rem;
            padding: 0;
        }

        .apply-button {
            height: 3rem;
            padding-inline: 1.25rem;
            font-size: 1rem;
            background-color: #be3300;
        }

        .saving-status {
            grid-area: status;
            justify-self: end;
            min-height: 1rem;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.04rem;
            text-transform: uppercase;
            color: var(--muted);
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .saving-status.is-visible {
            opacity: 1;
        }

        .apply-button:disabled,
        .change-button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        #controls-section h2 {
            margin-bottom: 1.25rem;
        }

        /* --- Bottom actions: Snapshot + Logout, side by side. Any status or
           result message for either action is shown inside that button
           itself (short text), and the button disables while busy. --- */
        .bottom-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 1.75rem;
        }

        .bottom-actions button {
            height: 3.1rem;
            padding-inline: 0.75rem;
            font-size: 0.88rem;
            line-height: 1.2;
            white-space: normal;
        }

        .bottom-actions .logout-button {
            flex: 1 1 0;
            min-width: 90px;
        }

        .bottom-actions .snapshot-button {
            flex: 3 1 0;
            min-width: 180px;
        }

        .snapshot-button {
            background-color: var(--accent);
        }

        .snapshot-button:disabled,
        .logout-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .logout-button {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }

        /* Wider screens: the more spacious 3-column arrangement */
        @media (min-width: 640px) {
            .control-tile {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                gap: 1.25rem;
                min-height: 5rem;
                padding: 1rem 1.25rem;
            }

            .control-meta {
                flex-shrink: 0;
            }

            .change-control {
                flex-wrap: nowrap;
            }
        }
    </style>
</head>
<body>
    <div class="block-container">
        <!-- Auth View Container -->
        <div id="login-section" data-testid="stForm" style="max-width: 450px; margin: 4rem auto; display: block;">
            <h2>Counselor Access</h2>
            <p style="color: var(--muted);">Enter the PIN to unlock score updates.</p>
            <input type="password" id="pin-input" placeholder="Enter PIN" style="width: 100%; margin: 1rem 0; padding: 0.7rem;">
            <button onclick="handleLogin()" style="width: 100%;">Login</button>
        </div>

        <!-- Authenticated Controls View Container -->
        <div id="controls-section" style="display: none;">
            <h2 style="text-align: center;">Control Panel</h2>
            <p id="camp-day-indicator" style="color: var(--muted); text-align: center; margin-top: -0.75rem; margin-bottom: 1.25rem; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08rem;"></p>
            <div id="counselor-rows" class="controls-list"></div>
            <div class="bottom-actions">
                <button type="button" id="logout-button" class="logout-button" onclick="handleLogout()">Logout</button>
                <button type="button" id="snapshot-button" class="snapshot-button" onclick="captureSnapshot()"></button>
            </div>
        </div>
    </div>

    <script>
        const teamLookup = {};

        function getTeamName(row) {
            return row.Team ?? row.team_name ?? row.team ?? 'Unknown Team';
        }

        function getLeader(row) {
            return row.LEADER_COLUMN ?? row.leader ?? 'No Leader Assigned';
        }

        function getPoints(row) {
            const value = row.Points ?? row.points_summed ?? row.points ?? 0;
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : 0;
        }

        let dayColumns = [];
        let summaryColumn = null;
        let currentDayColumn = null;
        let currentDayIndex = null;

        async function fetchConfig() {
            try {
                const res = await fetch('/api/day-columns', { credentials: 'same-origin' });
                if (!res.ok) return { days: [], summaryColumn: null, currentDayColumn: null, currentDayIndex: null };
                const data = await res.json();
                return {
                    days: Array.isArray(data.days) ? data.days : [],
                    summaryColumn: data.summaryColumn ?? null,
                    currentDayColumn: data.currentDayColumn ?? null,
                    currentDayIndex: data.currentDayIndex ?? null
                };
            } catch (error) {
                return { days: [], summaryColumn: null, currentDayColumn: null, currentDayIndex: null };
            }
        }

        function getTodayPoints(row) {
            if (currentDayColumn) {
                // Read from the active daily column tracking payload variable 
                const val = row[currentDayColumn];
                // Fallback to 0 if the cell value is an empty string
                if (val === '' || val === undefined) return 0;
                const parsed = Number(val);
                if (Number.isFinite(parsed)) return parsed;
            }
            return 0;
        }

        function getOverallPoints(row) {
            if (summaryColumn) {
                const parsed = Number(row[summaryColumn]);
                if (Number.isFinite(parsed)) return parsed;
            }
            return 0;
        }

        let snapshotMessageUntil = 0;

        function updateDayIndicator() {
            const el = document.getElementById('camp-day-indicator');
            if (el) {
                el.textContent = currentDayIndex && currentDayIndex <= dayColumns.length
                    ? `Day ${currentDayIndex} of ${dayColumns.length} in progress`
                    : `All ${dayColumns.length} camp days captured`;
            }

            const btn = document.getElementById('snapshot-button');
            if (!btn || Date.now() < snapshotMessageUntil) return;

            const dayIsActive = currentDayIndex && currentDayIndex <= dayColumns.length;
            btn.textContent = dayIsActive ? `Snapshot Day ${currentDayIndex}` : 'All Days Captured';
            btn.disabled = !dayIsActive;
        }

        function getCleanKey(teamName) {
            return teamName.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
        }

        function getChangeValue(cleanKey) {
            return Number(document.getElementById(`input-${cleanKey}`).value || 0);
        }

        function setChangeValue(cleanKey, value) {
            document.getElementById(`input-${cleanKey}`).value = value;
        }

        function setSavingState(cleanKey, isSaving) {
            const status = document.getElementById(`status-${cleanKey}`);
            const applyButton = document.getElementById(`apply-${cleanKey}`);
            const minusButton = document.getElementById(`minus-${cleanKey}`);
            const plusButton = document.getElementById(`plus-${cleanKey}`);
            const input = document.getElementById(`input-${cleanKey}`);

            if (status) {
                status.textContent = isSaving ? 'Saving new score...' : '';
                status.classList.toggle('is-visible', isSaving);
            }

            if (applyButton) applyButton.disabled = isSaving;
            if (minusButton) minusButton.disabled = isSaving;
            if (plusButton) plusButton.disabled = isSaving;
            if (input) input.disabled = isSaving;
        }

        function bindChangeInput(cleanKey) {
            const input = document.getElementById(`input-${cleanKey}`);
            input.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    submitScore(cleanKey);
                }
            });
        }

        function adjustChange(cleanKey, delta) {
            setChangeValue(cleanKey, getChangeValue(cleanKey) + delta);
        }

        async function checkAuth() {
            const res = await fetch('/api/auth', { credentials: 'same-origin' });
            if (res.ok) {
                loadCounselorPanel();
                return;
            }

            document.getElementById('login-section').style.display = 'block';
            document.getElementById('controls-section').style.display = 'none';
        }

        async function handleLogin() {
            const pin = document.getElementById('pin-input').value;
            const formData = new FormData();
            formData.append('pin', pin);

            const res = await fetch('/api/login', { method: 'POST', body: formData, credentials: 'same-origin' });
            if(res.ok) {
                loadCounselorPanel();
            } else {
                alert('Incorrect Camp PIN');
            }
        }

        async function handleLogout() {
            const button = document.getElementById('logout-button');
            button.disabled = true;
            button.textContent = 'Logging out…';

            try {
                await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
                window.location.reload();
            } catch (error) {
                button.textContent = 'Logout failed — retry';
                button.disabled = false;
            }
        }

        let refreshTimer = null;

        async function loadCounselorPanel() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('controls-section').style.display = 'block';

            const [res, config] = await Promise.all([
                fetch('/api/scores', { credentials: 'same-origin' }),
                fetchConfig()
            ]);
            dayColumns = config.days;
            summaryColumn = config.summaryColumn;
            currentDayColumn = config.currentDayColumn;
            currentDayIndex = config.currentDayIndex;
            const data = await res.json();

            data.sort((a, b) => getTeamName(a).localeCompare(getTeamName(b)));

            updateDayIndicator();

            const container = document.getElementById('counselor-rows');
            container.innerHTML = '';

            data.forEach((row, index) => {
                const teamName = getTeamName(row);
                const todayPoints = getTodayPoints(row);
                const overallPoints = getOverallPoints(row);
                const cleanKey = getCleanKey(teamName);
                const leaderName = getLeader(row);
                teamLookup[cleanKey] = teamName;
                container.innerHTML += `
                    <div data-testid="stForm" class="control-tile">
                        <div style="display: flex; flex-direction: column; width: 100%;">
                            <div class="team-title" style="text-align: left; margin: 0;">${teamName}</div>
                            <div style="color: var(--muted); font-size: 0.9rem; margin-top: 0.2rem; margin-bottom: 0.75rem; text-align: left;">${leaderName}</div>
                        </div>

                        <div class="control-meta">
                            <div class="points-row">
                                <div class="overall-points" id="overall-${cleanKey}">${overallPoints}<span>Overall Points</span></div>
                                <div class="current-points" id="pts-${cleanKey}">${todayPoints}<span>Points Today</span></div>
                            </div>
                            <div class="change-control">
                                <input type="number" id="input-${cleanKey}" class="change-value" value="0" step="1">
                                <button type="button" id="minus-${cleanKey}" class="change-button minus-button" onclick="adjustChange('${cleanKey}', -1)">-</button>
                                <button type="button" id="plus-${cleanKey}" class="change-button plus-button" onclick="adjustChange('${cleanKey}', 1)">+</button>
                                <button type="button" id="apply-${cleanKey}" class="apply-button" onclick="submitScore('${cleanKey}')">Apply</button>
                            </div>
                            <div id="status-${cleanKey}" class="saving-status"></div>
                        </div>
                    </div>
                `;
                bindChangeInput(cleanKey);
            });

            if (!refreshTimer) {
                refreshTimer = setInterval(refreshCounselorPoints, 10000);
            }
        }

        // Lightweight periodic refresh: updates only the displayed point
        // values and day indicator in place, so it never disturbs a
        // counselor who's mid-way through typing a change into an input.
        // Config is refetched every cycle (not cached) since another admin
        // clicking Snapshot changes the active day server-side.
        async function refreshCounselorPoints() {
            try {
                const [res, config] = await Promise.all([
                    fetch('/api/scores', { credentials: 'same-origin' }),
                    fetchConfig()
                ]);
                dayColumns = config.days;
                summaryColumn = config.summaryColumn;
                currentDayColumn = config.currentDayColumn;
                currentDayIndex = config.currentDayIndex;
                const data = await res.json();

                updateDayIndicator();

                data.forEach(row => {
                    const cleanKey = getCleanKey(getTeamName(row));
                    const ptsEl = document.getElementById(`pts-${cleanKey}`);
                    const overallEl = document.getElementById(`overall-${cleanKey}`);
                    if (ptsEl) ptsEl.innerHTML = `${getTodayPoints(row)}<span>Points Today</span>`;
                    if (overallEl) overallEl.innerHTML = `${getOverallPoints(row)}<span>Overall Points</span>`;
                });
            } catch (error) {
                // Silently skip this cycle - the next poll will retry.
            }
        }

        async function captureSnapshot() {
            const button = document.getElementById('snapshot-button');

            const confirmed = window.confirm(
                currentDayIndex
                    ? `Snapshot Day ${currentDayIndex}? This locks in today's points and can't be undone.`
                    : `Capture this snapshot? This can't be undone.`
            );
            if (!confirmed) return;

            button.disabled = true;
            button.textContent = 'Capturing…';
            snapshotMessageUntil = Date.now() + 60000; // hold this message until we're done

            try {
                const res = await fetch('/api/capture-snapshot', {
                    method: 'POST',
                    credentials: 'same-origin'
                });

                let data = null;
                try {
                    data = await res.json();
                } catch (error) {
                    data = null;
                }

                if (res.ok) {
                    button.textContent = data.next_day ? `Day ${data.day} captured ✓` : 'All Days Captured ✓';
                    await loadCounselorPanel();
                } else {
                    button.textContent = (data?.detail ?? 'Snapshot failed').slice(0, 42);
                    button.disabled = false;
                }
            } catch (error) {
                button.textContent = 'Network error — retry';
                button.disabled = false;
            } finally {
                snapshotMessageUntil = Date.now() + 3000;
                setTimeout(updateDayIndicator, 3000);
            }
        }

        async function submitScore(cleanKey) {
            const teamName = teamLookup[cleanKey];
            const val = getChangeValue(cleanKey);
            if (val === 0) return alert('Enter a value first.');

            setSavingState(cleanKey, true);

            try {
                const formData = new FormData();
                formData.append('team', teamName);
                formData.append('change', val);

                const res = await fetch('/api/update-score', {
                    method: 'POST',
                    body: formData,
                    credentials: 'same-origin'
                });

                let data = null;
                try {
                    data = await res.json();
                } catch (error) {
                    data = null;
                }

                if (res.ok) {
                    // Instantly update just the "today" value on screen with the new total.
                    document.getElementById(`pts-${cleanKey}`).innerHTML = `${data.new_score}<span>Points Today</span>`;
                    setChangeValue(cleanKey, 0);
                } else {
                    alert(data?.detail ?? 'Session expired or error saving update.');
                    checkAuth();
                }
            } finally {
                setSavingState(cleanKey, false);
            }
        }
        checkAuth();
    </script>
</body>
</html>
